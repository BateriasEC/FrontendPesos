# Stack FRONTEND — Portainer (misma red que backend y Postgres).
# BACKEND_HOST = servicio del API en el otro stack (backend-api).
version: "3.9"

services:
  frontend-web:
    image: kevinquishpe1/reciclaje_frontend:v8
    container_name: frontend-app
    restart: always
    ports:
      - "8080:80"
    networks:
      - red_reciclaje

networks:
  red_reciclaje:
    external: true
