# Front en stack separado (p. ej. Portainer). El API es otro servicio; no hay proxy nginx.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
