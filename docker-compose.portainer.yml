# Stack FRONTEND — Portainer (VM). La imagen publicada sigue sirviendo puerto 80.
version: "3.9"

services:
  frontend-web:
    image: alek21/brandonpesantez-reciclaje-frontend:v5
    container_name: frontend-app
    restart: always
    ports:
      - "8080:80"
    networks:
      - red_reciclaje

networks:
  red_reciclaje:
    external: true
